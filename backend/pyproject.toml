[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "4by4-cms"
version = "0.1.0"
description = "Multi-tenant college management platform"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "bcrypt>=4.2",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.3", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
