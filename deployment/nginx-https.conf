server {
    listen 80;
    server_name ias-cms.4by4softwares.com;

    location /.well-known/acme-challenge/ {
        root /var/www/ias-cms;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ias-cms.4by4softwares.com;

    ssl_certificate /etc/letsencrypt/live/ias-cms.4by4softwares.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ias-cms.4by4softwares.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    root /var/www/ias-cms;
    index index.html;

    location /api/ {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health/live {
        proxy_pass http://127.0.0.1:8005/health/live;
        proxy_set_header Host $host;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
